name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  wealth-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run deterministic math tests
        run: python3 skills/personal-wealth-manager/scripts/test_wealth_math.py
